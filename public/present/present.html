<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Human Layer: Presenter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<style>
:root{--ink:#0B0B0B;--iv:#FBF8F0;--card:#FFFFFF;--line:#D9D0B8;--mut:#5A564C;--red:#C8111F;--grn:#17692B;--yel:#F8B808;--grey:#E9E3D3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'DM Sans',Arial,sans-serif}
#view{position:fixed;left:0;right:0;top:0;bottom:44px;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none;overflow:hidden;background:var(--ink)}
.sl{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:none}
.sl.on{display:block}
.sl>section{width:1920px!important;height:1080px!important;position:relative;overflow:hidden;box-sizing:border-box}
.sl aside{display:none}
.serif{font-family:'DM Serif Display',Georgia,serif}
p,h1,h2,h3{margin:0}
/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(0,0,0,.82);color:#FBF8F0;font:600 15px 'DM Sans',sans-serif;z-index:20;transition:opacity .25s}
#bar.hide{opacity:0;pointer-events:none}
body.showmode #bar,body.showmode #notes,body.showmode #login{display:none!important}
body.showmode{cursor:none}
body.showmode #view{bottom:0}
@media (pointer:coarse){#bar button{padding:14px 20px;font-size:18px}}
#bar button{font:700 15px 'DM Sans',sans-serif;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;background:#FBF8F0;color:#0B0B0B}
#bar button.r{background:#C8111F;color:#fff}#bar button.g{background:#17692B;color:#fff}
#bar .sp{flex:1}
#phase{padding:3px 10px;border-radius:99px;background:#444}
#phase.open{background:#17692B}#phase.revealed,#phase.closed{background:#C8111F}
#dot{width:12px;height:12px;border-radius:50%;background:#C8111F}#dot.ok{background:#2fbf5b}
#notes{position:fixed;right:12px;bottom:64px;width:600px;max-width:calc(100vw - 24px);max-height:58vh;overflow:auto;white-space:pre-line;background:#fff;color:#111;border-radius:10px;padding:16px 18px;font:19px/1.5 'DM Sans',sans-serif;z-index:30;display:none;box-shadow:0 8px 40px rgba(0,0,0,.5)}
#notes.on{display:block}
#login{position:fixed;inset:0;background:#0B0B0B;color:#FBF8F0;display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:14px;font:20px 'DM Sans',sans-serif}
#login input{font:20px 'DM Sans';padding:10px 14px;border-radius:8px;border:0;width:300px}
#login button{font:700 20px 'DM Sans';padding:10px 22px;border:0;border-radius:8px;background:#F8B808}
/* live slide parts */
.tag{display:inline-flex;font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 20px;border-radius:99px}
.num{font-variant-numeric:tabular-nums}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(1)}}
.pcard{background:#FFFBF0;color:#0B0B0B;display:flex;flex-direction:column;gap:10px;padding:18px 20px 0}
.barzone{height:290px;display:flex;flex-direction:column;justify-content:flex-end;margin:0 -20px}
.barzone .bn{font-size:60px;font-weight:700;line-height:1;padding:0 20px 8px;font-variant-numeric:tabular-nums}
.barzone .bf{height:0;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.barzone .bn.grew{animation:pop .5s ease-out}
.chip{background:rgba(0,0,0,.15);padding:8px 18px;border-radius:99px;font-size:26px;font-weight:700}
/* demo */
.dm{position:absolute;inset:0;padding:64px 96px 60px;background:#0B0B0B;color:#FBF8F0;display:flex;flex-direction:column;gap:26px}
.dm h2{font-size:84px;font-weight:400;line-height:1}
.pill{display:inline-flex;font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 20px;border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;padding:12px 30px;border-radius:10px;border:3px solid #0B0B0B;cursor:pointer;background:#fff;color:#0B0B0B}
.btn.pri{background:#17692B;color:#FBF8F0}.btn.yel{background:#F8B808}
.sld{display:flex;align-items:center;height:26px}
</style>
</head>
<body>
<img id="brand" src="/present/logo.png" alt="Gold Coast Games" style="position:fixed;right:18px;bottom:62px;width:64px;height:64px;background:#FBF8F0;border-radius:10px;padding:4px;z-index:15;pointer-events:none">
<div id="view"><div id="stage"></div></div>

<script>
(function(){
'use strict';
var RED='#C8111F',GRN='#17692B',YEL='#F8B808',INK='#0B0B0B',IV='#FBF8F0';
var code=(location.pathname.split('/')[2]||'').toUpperCase();
var SHOW=location.pathname.indexOf('/show/')===0, KEY=new URLSearchParams(location.search).get('k')||'';
if(SHOW)document.body.classList.add('showmode');
var stage=document.getElementById('stage'), V=null, idx=0, step=0, slides=[], live=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}

/* ---------- people, scenarios, matching (invented profiles; rule-based, not an AI model) ---------- */
var DIMS=['team','long','people','detail','unknown','speed','free'];
var PEOPLE={
 ama:{id:'ama',plus:["Deepest technical skill in the building", "Spots mistakes others miss", "Others ask her to check their work"],minus:["Does her best work alone, on long projects", "Half her usual time free this month"],name:'Ama',role:'The Master',col:RED,v:{ontime:8,team:2,long:9,people:4,detail:9,unknown:3,speed:3,free:5}},
 kofi:{id:'kofi',plus:["Explains anything simply", "People trust him quickly", "Brings sceptics along"],minus:["Energised by working with a team", "Prefers variety over fine detail"],name:'Kofi',role:'The Storyteller',col:YEL,v:{ontime:6,team:9,long:4,people:9,detail:3,unknown:5,speed:6,free:10}},
 yaw:{id:'yaw',plus:["Has never missed a deadline", "Same quality, week after week", "Careful with detail"],minus:["Likes a clear plan and a long, steady run", "Calm alone or in a small team"],name:'Yaw',role:'The Metronome',col:GRN,v:{ontime:10,team:5,long:9,people:5,detail:9,unknown:2,speed:5,free:10}},
 efua:{id:'efua',plus:["Fastest at completing work", "Thrives on short, urgent assignments", "Lifts the whole team"],minus:["Short, intense bursts; months-long work drains her", "Often works best alone, fast"],name:'Efua',role:'The Sprinter',col:INK,v:{ontime:7,team:3,long:1,people:6,detail:4,unknown:5,speed:10,free:8}},
 selorm:{id:'selorm',plus:["Thrives when nothing is clear", "Finds a route through the unknown", "Asks for help early"],minus:["Explores best in a small team", "Restless in repetitive work"],name:'Selorm',role:'The Pathfinder',col:'#8A8473',v:{ontime:7,team:6,long:6,people:6,detail:4,unknown:10,speed:6,free:9}}};
var ORDER=['ama','kofi','yaw','efua','selorm'];
var SC=[
 {n:1,act:'jobA',bg:YEL,fg:INK,title:'Month-end, 11:30 PM',text:'Payroll files are bouncing at your bank\'s payments API. 40,000 salaries must be resubmitted before the morning cut-off. You can release one person.',tags:['Before the cut-off','Hands-on','One person released'],
  story:'It is month-end, 11:30 PM, and you run technology at a bank in Accra. Each of your five people is holding something critical: core banking, cards and ATMs, the mobile app, fraud monitoring and regulatory reporting. Partner companies\' payroll files are bouncing at your payments API. The CFO calls: 40,000 salaries must be resubmitted before the morning cut-off. The vendor on call says the fault is in your setup, and only your team can change production. The incident manager can release one person. Everyone else stays on watch. Someone has to find the fault and fix it, hands-on, tonight.',
  facts:[['Time','Overnight, before the cut-off'],['Team','One person released. The rest stay on watch.'],['Pressure','40,000 salaries. Only your team can fix it.']],
  t:{team:3,long:1,people:3,detail:6,unknown:3,speed:9,free:6},w:{team:7,long:4,people:3,detail:4,unknown:3,speed:9,free:6}},
 {n:2,act:'jobB',bg:GRN,fg:IV,title:'Launch day for 300 agents',text:'A new bill-pay feature goes live in three weeks. 300 field agents to train, a support desk to staff, and a team of six who have never worked together.',tags:['3 weeks','Team of six','People and logistics'],
  story:'A new bill-pay feature goes live across the country in three weeks. 300 mobile money agents in Greater Accra and Kumasi need to be trained, the support desk needs a script for the questions agents will ask, and the day-one plan has to be printed and tested. Six people from product, support and marketing have been lent to you. They have never worked together. Half the job is detail and logistics. The other half is people: keeping agents, the partner and the team calm.',
  facts:[['Time','Three weeks'],['Team','Six people from product, support and marketing'],['Pressure','One launch day. No second try.']],
  t:{team:7,long:5,people:8,detail:7,unknown:5,speed:5,free:7},w:{team:8,long:4,people:8,detail:8,unknown:4,speed:4,free:6}},
 {n:3,act:'jobC',bg:RED,fg:IV,title:'Why do new customers go quiet?',text:'Four months, a team of five, weekly agent and customer calls in several languages, and a brief nobody agrees on.',tags:['4 months','Team of five','Unclear brief'],
  story:'A mobile payments company registers many new wallet customers, but too many never make a second transaction. The MD says: fix it by March. But nobody agrees what fixed means. Sales wants more activations, compliance wants every ID check completed, and the agents on the street say customers simply do not trust it yet. Customers register in Twi, Ga, Ewe, Dagbani and English, through the app, USSD or an agent. A team of five, a call with agents or customers every week, and monthly numbers go to the board.',
  facts:[['Time','Four months'],['Team','Five, from sales, compliance and field support'],['Pressure','A vague brief. Numbers the board will read.']],
  t:{team:7,long:8,people:8,detail:7,unknown:8,speed:3,free:7},w:{team:7,long:7,people:8,detail:6,unknown:8,speed:3,free:6}}];
var DL={team:'Team',long:'Long project',people:'People contact',detail:'Detail',unknown:'Unclear brief',speed:'Speed',free:'Time free'};
function fit(dim,p,t){return dim==='free'?Math.min(1,p/t):1-Math.abs(p-t)/10}
function phrase(dim,sc,p){var t=sc.t[dim];
 if(dim==='team')return t>=7?(p>=7?'works best in a team, which this job needs':'is comfortable in a team, which this job needs'):t<=4?'does their best work alone, which this job needs':'is comfortable in a small team';
 if(dim==='long')return t>=6?'is steady over a long run':t<=3?'thrives on short, intense stretches':'is fine with a medium-length project';
 if(dim==='people')return 'is strong with customers and colleagues';
 if(dim==='detail')return 'keeps the detail right';
 if(dim==='unknown')return 'thrives when the brief is still unclear';
 if(dim==='speed')return 'moves fast';
 return 'has the time free ('+p+' of 10)';}
function weak(dim,sc){var t=sc.t[dim];
 if(dim==='team')return 'prefers working alone';if(dim==='long')return t>=6?'prefers shorter projects':'prefers long projects';
 if(dim==='people')return 'is less people-facing';if(dim==='detail')return 'is looser on detail';if(dim==='unknown')return 'prefers a clear brief';if(dim==='speed')return 'works at a steadier pace';return 'has less time free';}
function whyNot(dim,sc,p){var t=sc.t[dim];
 if(dim==='team')return p<t?'prefers working alone, and this job needs a team':'prefers a team, and this job is mostly solo';
 if(dim==='long')return p<t?'prefers shorter projects, and this one runs long':'prefers long projects, and this one is short';
 if(dim==='people')return 'is less at home with people, and this job is full of them';
 if(dim==='detail')return p<t?'is looser on detail, and this job needs it right':'is very detail-focused, and this job needs speed';
 if(dim==='unknown')return p<t?'prefers a clear brief, and this one is unclear':'prefers fuzzy briefs, and this one is clear';
 if(dim==='speed')return p<t?'works at a steadier pace, and this job is urgent':'works faster than this job needs';
 return 'has less time free ('+p+' of 10)';}
function match(sc){
 var W=0;DIMS.forEach(function(d){W+=sc.w[d]});
 return ORDER.map(function(id){var P=PEOPLE[id],s=0,parts=[];
  DIMS.forEach(function(d){var f=fit(d,P.v[d],sc.t[d]);s+=sc.w[d]*f;parts.push({d:d,f:f,c:sc.w[d]*f,w:sc.w[d]})});
  var good=parts.filter(function(x){return x.f>=0.8&&x.w>=5}).sort(function(a,b){return b.c-a.c}).slice(0,3);
  var bad=parts.filter(function(x){return x.f<=0.6&&x.w>=5}).sort(function(a,b){return b.w*(1-b.f)-a.w*(1-a.f)})[0];
  var gp=parts.slice().sort(function(a,b){return b.w*(1-b.f)-a.w*(1-a.f)})[0];return {id:id,why:whyNot(gp.d,sc,P.v[gp.d]),score:s/W,good:good.map(function(x){return phrase(x.d,sc,P.v[x.d])}),watch:bad?weak(bad.d,sc):null};
 }).sort(function(a,b){return b.score-a.score});}
function sliderRow(l,r,pos,col,fg){return '<div style="display:flex;flex-direction:column;gap:2px"><div style="display:flex;justify-content:space-between;font-size:24px;font-weight:700"><span>'+l+'</span><span>'+r+'</span></div><div class="sld"><div style="flex:0 0 '+pos+'%;height:8px;background:'+col+'"></div><div style="width:26px;height:26px;border-radius:50%;background:'+col+';border:4px solid '+INK+'"></div><div style="flex:1;height:8px;background:#D9D0B8"></div></div></div>'}

/* ---------- slide definitions ---------- */
var DEF=[
 {id:'about',live:'about',steps:2,note:'OPENING. 1) GROUND: We are Gold Coast Games. We have done this work before, and this is how it looks. 2) PRESS THE RIGHT ARROW: the reel plays (about 25 seconds). Say: this is a game to educate people about the climate crisis in Ghana, made for Kantamanto Upcyclers and the OR Foundation. It is an education game about sustainable living, and we made it fun. Look at their reaction. Let it run. 3) AFTER THE REEL, the range: We have done the same at events for AU ECOSOCC, and we have reached all the way to a realistic ITSM simulation. For those who do not know, ITSM is IT service management: how IT teams handle incidents, requests and changes. That one is in development. We also host our own flagship game nights, in a space in Dzorwulu, where we experiment with our products and test the market. 4) THE POINT: Through research, we can create games at multiple layers, and hopefully you learn more as we go along. 5) THE STEP UP: This deck shows a much more ambitious project: a fun, engaging system to help manage my games company, which might interest everybody in this room. It is in beta: we are testing it on our own crew first. I thought it would be interesting for this room, because at Agile in Africa, creating systems that work for our culture matters. (If time: it came from organising our own startup and making sure our people feel content and seen.) 6) PRESS THE RIGHT ARROW AGAIN: next slide. CAREFUL: say beta, not launched. The app is in beta and tested on your own crew. Say each client name only if you have permission, and check the exact spellings: Kantamanto Upcyclers, OR Foundation, AU ECOSOCC. Say climate crisis or waste crisis, whichever the game is really about. ITSM is IT service management, not systems management. Say in development for the simulation. Check the game nights are as described and ongoing before you say we host them. Check the people in the reel agreed to it being shown. Say might interest, not will. If the video does not appear, the frame says so: tell the same story without it.'},{id:'cover',img:'cover'},{id:'people',img:'people'},{id:'turnover',img:'turnover'},{id:'number',img:'number'},
 {id:'join',live:'join',act:'onboard',note:'LIVE: JOIN. The QR is real. The onboarding form opens on phones as soon as this slide appears. Say: "Scan once and stay on one page for everything today. If you want to take part throughout, keep that page open." Do not say which half sees the countdown. • HELP A NEIGHBOUR ANSWER: point it out. At the bottom of the phone page there is a button, Help a neighbour answer. If someone next to you is stuck, or not used to smartphones, they can answer on YOUR phone, as their own person, and then you go back to your own answers. • WHY WE BUILT IT: to show that we can design tech platforms that take the current climate into account: not everybody is tech savvy or tech native, and we have to design for inclusion. Say it as a design choice, not a favour. • CAREFUL: it is the last thing on the phone page, so say where it is. Each neighbour gets their own name and their own answers. Fallback if wifi fails: show of hands. Press the right arrow at about 90 seconds: the next slide closes it and shows the result.'},
 {id:'arms',live:'arms',act:'onboard',post:['close','reveal'],note:'LIVE: RESULT OF THE ONBOARDING TEST. Press R to reveal the golden apple winner (fastest finisher across both cohorts). Read the real numbers whichever way they point. One room, a hint, not proof. • THE POINT, SAY IT SIMPLY: You may be wondering how the platform itself works with gamification. This is a small taste of it. Gamification is a process that helps: the aim is better systems that reward people, and we use it to make things fun. Life does not have to be so boring, and neither do systems. Who told us they have to be? Why not make it fun, if it does not take anything away? We spend most of our lives in them. • CAREFUL: call it a taste and a hint, not proof: one room, one test. If someone says fun distracts from serious work: the aim is to make the right behaviour easier and recognised, not to turn work into a score. People still decide. A group under 10 is "too few to compare".'},
 {id:'vote',img:'vote',act:'__idle'},
 {id:'pick',live:'pick',n:0,act:'jobA',note:'LIVE: THE VOTE. Thirty seconds. They vote on their phones as the team leader. The bars grow as votes arrive. Say: the first person to pull the right person wins a golden apple. If it feels hard on your own, turn to the people next to you, talk it through and decide together. Everyone still votes on their own phone. Press R to reveal: the winner name appears on the big screen. The ideal answer is Efua (fast, hands-on, alone, hard cut-off): the full reasons are on the next slide notes. Whoever they picked is defensible. Press the right arrow to close the vote and see the final numbers.'},
 {id:'pickr',live:'result',n:0,post:['close','reveal'],note:'LIVE: THE VOTE RESULT. Read the tallest out. The room decided, not the system. • THE IDEAL PICK: EFUA. Tonight is a sprint: hands-on, alone, against a hard cut-off. Efua is the fastest on the team (speed 10) and thrives on short, urgent jobs. • SAY THE COST: Efua accuracy is lower (4 out of 10), so name a reviewer. Ama or Yaw checks the fix before it goes live. • WHY NOT THE OTHERS: Ama is the most accurate (9), so she signs it off, but speed 3 is too slow for a fixed cut-off. Kofi wins the room, but this job is not about people. Yaw is the long, steady job, not a night sprint. Selorm shines when nothing is clear, but here the fault is known. • WHY SOME GOT IT WRONG: it is natural to pick the most trusted (track record) or the most careful when the stakes feel high. The job decides who fits best, not who is best overall. Say: not wrong, a different fit. • NEXT: now change the job, and meet the system that helps.'},
 {id:'shortlist',img:'shortlist'},{id:'demovid',live:'video',video:'demo.mp4',note:'THIS ISN\u2019T JUST A CONCEPT, about 90s with the film (75s). This slide holds the demo video: it plays on the projector with sound, this screen shows a card only. • BEFORE: This is GCG Game Plan. It is in beta, and we are testing it in our own company first. The people in the video are made up. • DURING: say nothing. Let it run, about 75 seconds. • AFTER, one line each: the manager adds the job, the system suggests with reasons, the manager decides, the person says yes or asks first. The system suggests, humans decide. • BE HONEST: matching is rule-based today and AI is next. It is a beta: we are still learning what breaks. • INVITE: what I would love to learn from this room is where this would break in your organisation. • FALLBACK if the video will not play: describe the loop in one sentence and go to the next slide.'},{id:'notjust',img:'notjust'},{id:'demo',img:'demo',link:{href:'https://claude.ai/artifact/P44iPoxS3QN5m5mc7zefuF',x:128,y:304,w:435,h:74}},
 {id:'changed',img:'changed'},{id:'three',img:'three'},{id:'glue',img:'glue'},{id:'values',img:'values'},{id:'choice',img:'choice'},{id:'whatchanged',img:'whatchanged'},
 {id:'ask',img:'ask',act:'interest',over:'interest'},
 {id:'final',img:'final',act:'rate'}];


/* ---------- golden apples: shown only after the host reveals ---------- */
var prizeEl=document.createElement('div');prizeEl.id='prize';prizeEl.style.cssText='position:fixed;left:0;right:0;top:0;background:#0B0B0B;color:#F8B808;padding:0.4vh 2vw;font-weight:800;font-size:2.6vh;line-height:1.25;text-align:center;z-index:30;display:none';document.body.appendChild(prizeEl);
var clEl=document.createElement('div');clEl.id='cl';clEl.style.cssText='position:fixed;left:12px;bottom:56px;max-width:46vw;background:#fff;color:#111;border-radius:8px;padding:8px 12px;font:600 15px DM Sans,sans-serif;z-index:25;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)';document.body.appendChild(clEl);
function prizeUpd(){var d=DEF[idx],r=V&&V.currentResults,t='';
 if(!SHOW){var cl=r&&r.correctList&&['pick','pickr'].indexOf(d&&d.id)>-1?r.correctList:null;if(cl&&cl.length){var c='Only you see this. Got it right, in order ('+cl.length+'): '+cl.slice(0,12).map(esc2).join(', ')+(cl.length>12?' ...':'');if(clEl.textContent!==c)clEl.textContent=c;clEl.style.display='block'}else clEl.style.display='none'}
 if(d&&['arms','pick','pickr'].indexOf(d.id)>-1&&V.state&&V.state.phase==='revealed'&&r){
  if(r.firstCorrect&&r.firstCorrect.label)t='GOLDEN APPLE &middot; first to get it right: '+esc2(r.firstCorrect.label);
  else if(r.firstTimedFinisher&&r.firstTimedFinisher.label)t='GOLDEN APPLE &middot; fastest to join: '+esc2(r.firstTimedFinisher.label)+' ('+r.firstTimedFinisher.seconds+'s)';}
 if(t){if(prizeEl.innerHTML!==t)prizeEl.innerHTML=t;prizeEl.style.display='block'}else prizeEl.style.display='none'}
function esc2(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
setInterval(prizeUpd,400);
/* 10-minute slot: the default run. Add ?len=full to both the tablet and the projector link for the whole deck. */
var TEN=['about','cover','people','turnover','number','join','arms','vote','pick','pickr','demovid','changed','ask','final'];
if(new URLSearchParams(location.search).get('len')!=='full')DEF=DEF.filter(function(d){return TEN.indexOf(d.id)>-1});
var BUILD={};
function vcard(t,s){return '<section style="width:1920px;height:1080px;background:#0B0B0B;color:#FBF8F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px"><p style="font-size:96px;font-weight:800">'+t+'</p><p style="font-size:44px;color:#F8B808">'+s+'</p></section>'}

  if(!SHOW&&d.act&&live){ if(d.act==='__idle')api('idle'); else api('open',d.act); }
  if(!SHOW&&d.post&&live){ d.post.reduce(function(p,a){return p.then(function(){return api(a)})},Promise.resolve()); }
  applyOV();
  if(!SHOW)pushSlide();
  if(d.upd&&V)d.upd();
  status();
}
function next(){var d=DEF[idx];if(d.steps&&step<d.steps-1){if(step===1&&!DEMO.chosen&&DEMO.res)DEMO.chosen=DEMO.res[0].id;step++;d.render();status();pushSlide();return}if(idx<DEF.length-1)show(idx+1,0)}
function prev(){var d=DEF[idx];if(d.steps&&step>0){step--;d.render();status();pushSlide();return}if(idx>0)show(idx-1,0)}
var OV=0;
function applyOV(){var b=$('ovbox_i');if(b)b.style.display=(OV&&DEF[idx]&&DEF[idx].over==='interest')?'flex':'none';var bt=$('bCount');if(bt)bt.textContent=OV?'Hide count (I)':'Show count (I)'}
function toggleCount(){var d=DEF[idx];if(!d||d.over!=='interest')return;OV=OV?0:1;applyOV();pushSlide()}
document.addEventListener('keydown',function(e){
 if(SHOW){if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}return}
 if(e.target&&e.target.tagName==='INPUT')return;
 var k=e.key;
 if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();next()}
 else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev()}
 else if(k==='o'||k==='O'){var d=DEF[idx];if(d.act&&d.act!=='__idle')api('open',d.act)}
 else if(k==='c'||k==='C')api('close');
 else if(k==='r'||k==='R')api('reveal');
 else if(k==='n'||k==='N')$('notes').classList.toggle('on');
 else if(k==='f'||k==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
 else if(k==='h'||k==='H')$('bar').classList.toggle('hide');
 else if(k==='i'||k==='I')toggleCount();
});
$('bProj').onclick=function(){var u=location.origin+'/show/'+code+'?k='+(V&&V.screenKey||'');try{navigator.clipboard.writeText(u)}catch(e){}prompt('Open this on the projector laptop (copied if your browser allows):',u)};$('bCount').onclick=toggleCount;$('bPrev').onclick=prev;$('bNext').onclick=next;$('bOpen').onclick=function(){var d=DEF[idx];if(d.act&&d.act!=='__idle')api('open',d.act)};$('bClose').onclick=function(){api('close')};$('bRev').onclick=function(){api('reveal')};$('bNotes').onclick=function(){$('notes').classList.toggle('on')};$('bFull').onclick=function(){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};$('bHide').onclick=function(){$('bar').classList.add('hide')};

var tx=0;stage.addEventListener('touchstart',function(e){tx=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',function(e){if(SHOW)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60){if(dx<0)next();else prev()}},{passive:true});
function fitStage(){var s=Math.min(innerWidth/1920,(innerHeight-(SHOW?0:44))/1080);stage.style.transform='scale('+s+')'}
addEventListener('resize',fitStage);fitStage();

function connect(){
  var es=new EventSource('/api/host/s/'+code+'/stream');
  es.addEventListener('host',function(e){V=JSON.parse(e.data);live=true;$('dot').className='ok';var d=DEF[idx];if(d&&d.upd)d.upd();status()});
  es.onerror=function(){live=false;$('dot').className=''};
}
function bootShow(){
  var built=false, es=new EventSource('/api/screen/'+code+'/stream?k='+encodeURIComponent(KEY));
  es.addEventListener('host',function(e){
    V=JSON.parse(e.data); live=true;
    function apply(){ var sl=V.slide||{idx:0,step:0}; if(sl.idx!==idx||!built){ show(Math.min(sl.idx,DEF.length-1),sl.step||0); } else if(sl.step!==step&&DEF[idx].steps){ step=sl.step; DEF[idx].render&&DEF[idx].render(); } OV=sl.ov?1:0; applyOV(); var d=DEF[idx]; if(d&&d.upd)d.upd(); }
    if(!built){ buildAll().then(function(){ built=true; apply(); }); } else apply();
  });
  es.onerror=function(){live=false};
}
function boot(){
  fetch('/api/host/s/'+code+'/view').then(function(r){
    if(r.status===401){$('login').style.display='flex';return null}
    if(r.status===404){document.body.innerHTML='<p style="color:#fff;font:24px sans-serif;padding:40px">Session '+esc(code)+' not found. Create one in the organiser page.</p>';return null}
    return r.json()}).then(function(v){if(!v)return;$('login').style.display='none';V=v;buildAll().then(function(){connect();var sl=v.slide||{idx:0,step:0};show(Math.max(0,Math.min(sl.idx||0,DEF.length-1)),sl.step||0)});});
}
$('go').onclick=function(){fetch('/api/host/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}).then(function(r){if(r.ok)boot();else $('lerr').textContent='Wrong password'})};
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click()});
window.__present={DEF:DEF,match:match,SC:SC,next:next,prev:prev,show:show,state:function(){return {idx:idx,step:step}}};
if(SHOW){bootShow();document.addEventListener('dblclick',function(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()})}else boot();
})();
</script>
